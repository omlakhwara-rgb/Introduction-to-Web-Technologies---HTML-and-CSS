
<!DOCTYPE html>
<html>
<head>
    <title>Spotify Playlist</title>

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        .playlist {
            display: flex;
            gap: 15px;
            padding: 20px;
        }

        .song-card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #282828;
            width: 180px;
            height: 100px;
            border-radius: 10px;
            padding: 10px;
        }

        .song-card h3 {
            margin: 5px;
        }

        .song-card p {
            margin: 5px;
            color: #b3b3b3;
        }
    </style>
</head>
<body>

    <h1>My Spotify Playlist</h1>

    <div class="playlist">

        <div class="song-card">
            <h3>Perfect</h3>
            <p>Ed Sheeran</p>
        </div>

        <div class="song-card">
            <h3>Believer</h3>
            <p>Imagine Dragons</p>
        </div>

        <div class="song-card">
            <h3>Memories</h3>
            <p>Maroon 5</p>
        </div>

        <div class="song-card">
            <h3>Shape of You</h3>
            <p>Ed Sheeran</p>
        </div>

        <div class="song-card">
            <h3>Night Changes</h3>
            <p>One Direction</p>
        </div>

    </div>

</body>
</html>
