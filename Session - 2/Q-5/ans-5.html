<!DOCTYPE html>
<html>
<head>
    <title>Food Delivery Apps</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
        }

        h1 {
            color: #e23744;
        }

        table {
            margin: auto;
            width: 60%;
            border-collapse: collapse;
            background-color: white;
        }

        th {
            background-color: #e23744;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
        }

        table, th, td {
            border: 1px solid #ddd;
        }

        tr:hover {
            background-color: #ffe6e6;
        }
    </style>
</head>
<body>

    <h1>Food Delivery Apps Comparison</h1>

    <table>
        <tr>
            <th>App Name</th>
            <th>Delivery Charges</th>
            <th>Rating</th>
        </tr>
        <tr>
            <td>Zomato</td>
            <td>₹30</td>
            <td>4.5/5</td>
        </tr>
        <tr>
            <td>Swiggy</td>
            <td>₹25</td>
            <td>4.4/5</td>
        </tr>
        <tr>
            <td>Uber Eats</td>
            <td>₹40</td>
            <td>4.2/5</td>
        </tr>
    </table>

</body>
</html>
