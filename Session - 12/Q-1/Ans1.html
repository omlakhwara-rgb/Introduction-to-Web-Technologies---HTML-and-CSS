<!DOCTYPE html>
<html>
<head>
    <title>Music Artist Landing Page</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #181818;
            color: white;
            text-align: center;
        }

        .container {
            padding: 50px 20px;
        }

        img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ff4081;
        }

        h1 {
            color: #ff4081;
            font-size: 36px;
        }

        p {
            max-width: 500px;
            margin: 20px auto;
            line-height: 1.6;
            color: #cccccc;
        }

        .social-buttons a {
            display: inline-block;
            padding: 12px 20px;
            margin: 10px;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            background-color: #ff4081;
            font-size: 16px;
        }

        .social-buttons a:hover {
            background-color: #e91e63;
        }
    </style>
</head>

<body>

    <div class="container">

        <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?w=400" alt="Music Artist">

        <h1>Arjun Music</h1>

        <h3>Singer | Songwriter | Music Producer</h3>

        <p>
            Hi, I am Arjun, a passionate music artist who loves creating
            beautiful melodies and meaningful songs. Follow me on social
            media to explore my latest music, videos, and updates.
        </p>

        <div class="social-buttons">
            <a href="https://www.instagram.com/" target="_blank">
                <i class="bi bi-instagram"></i> Instagram
            </a>

            <a href="https://www.youtube.com/" target="_blank">
                <i class="bi bi-youtube"></i> YouTube
            </a>

            <a href="https://www.facebook.com/" target="_blank">
                <i class="bi bi-facebook"></i> Facebook
            </a>
        </div>

    </div>

</body>
</html>
