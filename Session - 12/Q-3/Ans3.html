<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Product Showcase</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .header {
            background-color: #2874f0;
            color: white;
            padding: 15px;
            text-align: center;
        }

        .product-card {
            margin-bottom: 20px;
            text-align: center;
        }

        .product-card img {
            height: 180px;
            object-fit: contain;
            padding: 10px;
        }

        .product-card .btn {
            background-color: #fb641b;
            color: white;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Flipkart Product Showcase</h1>
        <p>Find Your Favorite Products</p>
    </div>

    <div class="container my-4">
        <div class="row">

            <div class="col-6 col-md-3">
                <div class="card product-card">
                    <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400" class="card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h5 class="card-title">Headphones</h5>
                        <p class="card-text">Price: ₹1,499</p>
                        <a href="#" class="btn">Buy Now</a>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card product-card">
                    <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400" class="card-img-top" alt="Watch">
                    <div class="card-body">
                        <h5 class="card-title">Smart Watch</h5>
                        <p class="card-text">Price: ₹2,499</p>
                        <a href="#" class="btn">Buy Now</a>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card product-card">
                    <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400" class="card-img-top" alt="Shoes">
                    <div class="card-body">
                        <h5 class="card-title">Sports Shoes</h5>
                        <p class="card-text">Price: ₹1,999</p>
                        <a href="#" class="btn">Buy Now</a>
                    </div>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="card product-card">
                    <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?w=400" class="card-img-top" alt="Camera">
                    <div class="card-body">
                        <h5 class="card-title">Camera</h5>
                        <p class="card-text">Price: ₹5,999</p>
                        <a href="#" class="btn">Buy Now</a>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
