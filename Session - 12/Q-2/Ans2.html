<!DOCTYPE html>
<html>
<head>
    <title>Featured Playlists</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
            margin: 30px 0;
            color: #1DB954;
        }

        .playlist-card {
            background-color: #202020;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .playlist-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 8px;
        }

        .playlist-card h4 {
            margin: 15px 0;
        }

        .btn-spotify {
            background-color: #1DB954;
            color: black;
            border-radius: 25px;
            padding: 10px 25px;
            font-weight: bold;
        }

        .btn-spotify:hover {
            background-color: #1ed760;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Featured Playlists</h1>

        <div class="row">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="playlist-card">
                    <img src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=500" alt="Party Hits">
                    <h4>Party Hits</h4>
                    <p>Best songs to enjoy your party.</p>
                    <a href="https://open.spotify.com/" target="_blank" class="btn btn-spotify">Listen Now</a>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="playlist-card">
                    <img src="https://images.unsplash.com/photo-1519608487953-e999c86e7455?w=500" alt="Chill Vibes">
                    <h4>Chill Vibes</h4>
                    <p>Relax and enjoy peaceful music.</p>
                    <a href="https://open.spotify.com/" target="_blank" class="btn btn-spotify">Listen Now</a>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="playlist-card">
                    <img src="https://images.unsplash.com/photo-1506157786151-b8491531f063?w=500" alt="Rock Classics">
                    <h4>Rock Classics</h4>
                    <p>Enjoy the greatest rock music.</p>
                    <a href="https://open.spotify.com/" target="_blank" class="btn btn-spotify">Listen Now</a>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
