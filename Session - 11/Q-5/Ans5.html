<!DOCTYPE html>
<html>
<head>
    <title>Theme Switcher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div id="mainContainer" class="container bg-light text-dark p-5 mt-4 rounded">

        <h2>Welcome to My Page</h2>
        <p>Click the button below to change the theme.</p>

        <button class="btn btn-primary" onclick="changeTheme()">
            Switch Theme
        </button>

    </div>

    <script>
        function changeTheme() {
            var container = document.getElementById("mainContainer");

            container.classList.toggle("bg-light");
            container.classList.toggle("bg-dark");

            container.classList.toggle("text-dark");
            container.classList.toggle("text-light");
        }
    </script>

</body>
</html>
