<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Product Card</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="text-center mb-4">Flipkart Products</h2>

        <div class="row">

            <div class="col-md-4">
                <div class="card m-1 p-2">
                    <img src="samsung-5g-mobile-under-15000.jpg" class="card-img-top" alt="Mobile">
                    <div class="card-body">
                        <h5 class="card-title">Samsung Mobile</h5>
                        <p class="card-text">Price: ₹15,999</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card m-3 p-3">
                    <img src="hp.jpg" class="card-img-top" alt="Laptop">
                    <div class="card-body">
                        <h5 class="card-title">HP Laptop</h5>
                        <p class="card-text">Price: ₹45,999</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card m-4 p-4">
                    <img src="images (1)head.jpg" class="card-img-top" alt="Headphones">
                    <div class="card-body">
                        <h5 class="card-title">Wireless Headphones</h5>
                        <p class="card-text">Price: ₹1,499</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
