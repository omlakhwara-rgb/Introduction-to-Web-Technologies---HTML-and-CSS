<!DOCTYPE html>
<html>
<head>
    <title>Restaurant List</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-4">
        <h2 class="text-center text-danger mb-4">Zomato Restaurants</h2>

        <div class="row">

            <div class="col-md-4 mb-3">
                <div class="card p-3 shadow">
                    <img src="pizza palace.jpg" class="card-img-top" alt="Pizza Restaurant">

                    <div class="card-body">
                        <h4 class="card-title">Pizza Palace</h4>
                        <p class="text-success fw-bold">Rating: 4.5 ⭐</p>
                        <p class="text-primary fw-bold">50% OFF on First Order</p>
                        <p class="text-success">● Open Now</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card p-3 shadow">
                    <img src="burgur house.jpg" class="card-img-top" alt="Burger Restaurant">

                    <div class="card-body">
                        <h4 class="card-title">Burger House</h4>
                        <p class="text-success fw-bold">Rating: 4.2 ⭐</p>
                        <p class="text-danger fw-bold">Buy 1 Get 1 Free</p>
                        <p class="text-danger">● Closed Now</p>
                    </div>
                </div>
            </div>

            <div class="col-md-4 mb-3">
                <div class="card p-3 shadow">
                    <img src="royal thali.jpg" class="card-img-top" alt="Indian Restaurant">

                    <div class="card-body">
                        <h4 class="card-title">Royal Thali</h4>
                        <p class="text-success fw-bold">Rating: 4.7 ⭐</p>
                        <p class="text-primary fw-bold">20% OFF on Orders</p>
                        <p class="text-success">● Open Now</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

</body>
</html>
