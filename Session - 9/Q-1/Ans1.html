<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Cards</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .product-card {
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            height: 100%;
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .product-card h5 {
            font-size: 20px;
        }

        .price {
            color: green;
            font-size: 22px;
            font-weight: bold;
        }

        .btn-buy {
            background-color: #2874f0;
            color: white;
        }

        .btn-buy:hover {
            background-color: #1558c0;
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Flipkart</a>
        </div>
    </nav>

    <div class="container">
        <h2 class="text-center mb-4">Our Products</h2>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="product-card">
                    <img src="iphun.png" alt="Smartphone">
                    <h5>Smartphone</h5>
                    <p>Latest smartphone with amazing features.</p>
                    <p class="price">₹14,999</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img src="laptop.jpg" alt="Laptop">
                    <h5>Laptop</h5>
                    <p>Powerful laptop for work and study.</p>
                    <p class="price">₹49,999</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>

            <div class="col-md-4">
                <div class="product-card">
                    <img src="headpones.jpg" alt="Headphones">
                    <h5>Headphones</h5>
                    <p>Wireless headphones with clear sound.</p>
                    <p class="price">₹1,999</p>
                    <button class="btn btn-buy">Buy Now</button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
