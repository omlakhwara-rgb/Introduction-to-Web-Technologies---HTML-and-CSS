
<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Product Card</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .product-card {
            width: 250px;
            border: 1px solid gray;
            padding: 15px;
            margin: 20px auto;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .product-card img {
            width: 100%;
            height: auto;
        }

        .product-card h2 {
            font-size: 20px;
        }

        .price {
            color: green;
            font-size: 18px;
        }

        button {
            background-color: #2874f0;
            color: white;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="product-card">
        <img src="headpones.jpg" alt="Wireless Headphones">

        <h2>Wireless Headphones</h2>

        <p class="price">Price: ₹999</p>

        <button>Add to Cart</button>
    </div>

</body>
</html>
