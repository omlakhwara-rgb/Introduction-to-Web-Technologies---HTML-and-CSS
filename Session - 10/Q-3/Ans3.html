<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Movie Carousel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .navbar {
            background-color: #333545;
        }

        .carousel {
            max-width: 800px;
            margin: 40px auto;
        }

        .carousel-item img {
            width: 100%;
            height: 400px;
            object-fit: cover;
        }

        .carousel-caption {
            background-color: rgba(0, 0, 0, 0.7);
            border-radius: 10px;
            padding: 10px;
        }

        .carousel-caption h5 {
            color: white;
            font-size: 24px;
        }

        .carousel-caption p {
            color: white;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">bookmyshow</a>
        </div>
    </nav>

    <div class="container">

        <h2 class="text-center mt-4">Featured Movies</h2>

        <div id="movieCarousel" class="carousel slide" data-bs-ride="carousel">

            <div class="carousel-indicators">
                <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="0"
                    class="active" aria-current="true" aria-label="Slide 1"></button>

                <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="1"
                    aria-label="Slide 2"></button>

                <button type="button" data-bs-target="#movieCarousel" data-bs-slide-to="2"
                    aria-label="Slide 3"></button>
            </div>

            <div class="carousel-inner">

                <div class="carousel-item active">
                    <img src="endgame.jpg"
                         class="d-block w-100" alt="Avengers Endgame">

                    <div class="carousel-caption">
                        <h5>Avengers: Endgame</h5>
                        <p>Action | Adventure | Sci-Fi</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="no way home.jpg"
                         class="d-block w-100" alt="Spider-Man">

                    <div class="carousel-caption">
                        <h5>Spider-Man: No Way Home</h5>
                        <p>Action | Adventure | Fantasy</p>
                    </div>
                </div>

                <div class="carousel-item">
                    <img src="avtar.jpg"
                         class="d-block w-100" alt="Avatar">

                    <div class="carousel-caption">
                        <h5>Avatar</h5>
                        <p>Sci-Fi | Adventure | Fantasy</p>
                    </div>
                </div>

            </div>

            <button class="carousel-control-prev" type="button"
                data-bs-target="#movieCarousel" data-bs-slide="prev">

                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>

            <button class="carousel-control-next" type="button"
                data-bs-target="#movieCarousel" data-bs-slide="next">

                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
