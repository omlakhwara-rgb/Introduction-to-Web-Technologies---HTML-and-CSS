<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Product Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f1f3f6;
        }

        .product-card {
            width: 300px;
            margin: 50px auto;
            border: none;
            border-radius: 10px;
            overflow: hidden;
        }

        .product-card img {
            height: 220px;
            object-fit: contain;
            padding: 15px;
        }

        .product-name {
            font-size: 20px;
            font-weight: bold;
        }

        .price {
            color: green;
            font-size: 24px;
            font-weight: bold;
        }

        .buy-btn {
            background-color: #2874f0;
            color: white;
            width: 100%;
        }

        .buy-btn:hover {
            background-color: #1558c0;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card product-card shadow">

            <img src="samsung-5g-mobile-under-15000.jpg"
                 class="card-img-top"
                 alt="Smartphone">

            <div class="card-body">

                <h5 class="card-title product-name">Samsung Smartphone</h5>

                <p class="card-text">
                    Powerful performance with a stunning display and long-lasting battery.
                </p>

                <p class="price">₹14,999</p>

                <button class="btn buy-btn">Buy Now</button>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
