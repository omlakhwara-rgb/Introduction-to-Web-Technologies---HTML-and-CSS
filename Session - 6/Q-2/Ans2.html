<!DOCTYPE html>
<html>
<head>
    <title>Flipkart Product Tile</title>

    <style>
        .product {
            border: 1px solid gray;
            padding: 15px;
            width: 220px;
            margin: 20px;
        }

        .product img {
            display: block;
            width: 200px;
        }

        .product-name {
            display: block;
            font-size: 18px;
        }

        .price {
            display: inline-block;
            color: green;
            font-size: 16px;
        }

        .hide-price {
            display: none;
        }
    </style>
</head>
<body>

    <div class="product">
        <img src="images (1)head.jpg" alt="Product Image">

        <h3 class="product-name">Wireless Headphones</h3>

        <p class="price hide-price">₹999</p>
    </div>

</body>
</html>
